<title>Veto Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Direction D « Sobre » : console B2B, barre latérale + contenu, surfaces neutres à 1 px, une seule couleur d'accent (violet Veto),
   couleurs d'état réservées au sens. Pensée pour un DAF d'ETI : vocabulaire comptable FR, chiffres tabulaires. */
:root {
  --bg: #f6f5f8; --surface: #ffffff; --surface-2: #f2f0f6; --sidebar: #fbfafc;
  --line: #e6e3ec; --line-strong: #cfcad9;
  --text: #17151e; --text-2: #5b5768; --text-3: #6f6b7d;
  --accent: #2e1a6b; --accent-hover: #3d2690; --accent-soft: #efebfb; --on-accent: #ffffff;
  --ok: #11714f; --ok-soft: #e3f3ec; --warn: #845400; --warn-soft: #fbf0d9; --danger: #b3341a; --danger-soft: #fbe8e2;
  --c-auto: #4b3bb5; --c-valide: #a99bf2; --c-bloque: #c2522b;
  --overlay: rgb(23 21 30 / 32%); --shadow: 0 12px 32px rgb(23 21 30 / 14%);
  --sans: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121017; --surface: #1a1722; --surface-2: #221e2c; --sidebar: #15121c;
  --line: #2c2838; --line-strong: #3d3850;
  --text: #eeebf5; --text-2: #aba6ba; --text-3: #8f8aa0;
  --accent: #a99bf2; --accent-hover: #bdb2f6; --accent-soft: #2a2342; --on-accent: #17121f;
  --ok: #5cc9a0; --ok-soft: #13302a; --warn: #e8b44e; --warn-soft: #33280f; --danger: #f08c6e; --danger-soft: #3a1d16;
  --c-auto: #8f7fea; --c-valide: #5a48c8; --c-bloque: #d4673e;
  --overlay: rgb(0 0 0 / 55%); --shadow: 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121017; --surface: #1a1722; --surface-2: #221e2c; --sidebar: #15121c;
  --line: #2c2838; --line-strong: #3d3850;
  --text: #eeebf5; --text-2: #aba6ba; --text-3: #8f8aa0;
  --accent: #a99bf2; --accent-hover: #bdb2f6; --accent-soft: #2a2342; --on-accent: #17121f;
  --ok: #5cc9a0; --ok-soft: #13302a; --warn: #e8b44e; --warn-soft: #33280f; --danger: #f08c6e; --danger-soft: #3a1d16;
  --c-auto: #8f7fea; --c-valide: #5a48c8; --c-bloque: #d4673e;
  --overlay: rgb(0 0 0 / 55%); --shadow: 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit }
.num, .mono { font-variant-numeric: tabular-nums }
.mono { font-family: var(--mono); font-size: 12.5px }
.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0 }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100% }

/* Barre latérale */
.side { background: var(--sidebar); border-right: 1px solid var(--line); padding: 16px 12px 16px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh }
.marque { display: flex; align-items: center; gap: 10px; padding: 4px 8px; font-weight: 600; font-size: 16px; letter-spacing: -.01em }
.org { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px }
.org b { font-weight: 500; display: block; font-size: 13px }
.org span { color: var(--text-3); font-size: 12px }
.nav { display: grid; gap: 2px }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; color: var(--text-2); text-decoration: none; font-weight: 500 }
.nav a:hover { background: var(--surface-2); color: var(--text) }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent) }
.nav .badge { margin-left: auto; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 600; line-height: 20px; min-width: 20px; text-align: center }
.nav .badge:empty, .nav .badge[data-n="0"] { display: none }
.nav-titre { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); padding: 10px 10px 4px }
.side-pied { margin-top: auto; display: grid; gap: 10px }
.moi { display: flex; align-items: center; gap: 10px; padding: 6px 8px }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex-shrink: 0 }
.moi b { font-weight: 500; display: block; font-size: 13px } .moi span { color: var(--text-3); font-size: 12px }

/* Contenu */
.main { min-width: 0; display: flex; flex-direction: column }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px max(24px, env(safe-area-inset-right, 0px)) 12px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
.recherche { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--text-3); width: min(340px, 40vw); background: var(--bg) }
.recherche input { border: 0; background: none; outline: none; font: inherit; color: var(--text); width: 100%; min-width: 0 }
.puce-env { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line-strong); color: var(--text-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap }
.topbar .date { color: var(--text-3); font-size: 13px; white-space: nowrap }
.contenu { padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px 24px; display: grid; gap: 20px; max-width: 1360px; width: 100% }
.entete { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap }
.entete h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em }
.entete p { margin: 2px 0 0; color: var(--text-2) }

.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.carte > header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.carte > header h2 { margin: 0; font-size: 14px; font-weight: 600 }
.carte > header a, .lien { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 13px; background: none; border: 0; cursor: pointer; padding: 0 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { padding: 14px 16px; display: grid; gap: 6px }
.kpi .lib { color: var(--text-2); font-size: 13px; display: flex; align-items: center; gap: 6px }
.kpi .val { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15 }
.kpi .sous { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums }
.kpi.action { cursor: pointer } .kpi.action:hover { border-color: var(--line-strong) }
.deux { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }

.segment { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface) }
.segment button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 13px }
.segment button[aria-pressed="true"] { background: var(--surface-2); color: var(--text) }

.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; padding: 7px 14px; font-weight: 500; cursor: pointer; border: 1px solid var(--line-strong); background: var(--surface); min-height: 34px; white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primaire { background: var(--accent); color: var(--on-accent); border-color: var(--accent) }
.btn.primaire:hover { background: var(--accent-hover) }
.btn.danger { color: var(--danger) }
.btn[disabled] { opacity: .5; cursor: not-allowed }

/* Tableaux */
.defile { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface) }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
td.droite, th.droite { text-align: right }
td.mono { white-space: nowrap }
tbody tr.clic { cursor: pointer }
tbody tr.clic:hover td { background: var(--surface-2) }
tbody tr[aria-selected="true"] td { background: var(--accent-soft) }
.cellule { display: grid; gap: 1px } .cellule span { color: var(--text-3); font-size: 12.5px }
.montant { font-weight: 500 }

.pastille { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12.5px; font-weight: 500; white-space: nowrap }
.pastille .ic { width: 13px; height: 13px; stroke-width: 2 }
.p-ok { background: var(--ok-soft); color: var(--ok) } .p-attente { background: var(--warn-soft); color: var(--warn) }
.p-refus { background: var(--danger-soft); color: var(--danger) } .p-neutre { background: var(--surface-2); color: var(--text-2) }
.p-accent { background: var(--accent-soft); color: var(--accent) }

/* Graphique */
.graph { padding: 12px 16px 14px; position: relative }
.graph svg { width: 100%; height: 240px; display: block }
.graph .grille { stroke: var(--line); stroke-width: 1 }
.graph text { fill: var(--text-3); font-size: 11px; font-family: var(--sans) }
.legende { display: flex; gap: 16px; flex-wrap: wrap; color: var(--text-2); font-size: 12.5px }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.infobulle { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 170px; display: grid; gap: 3px; z-index: 3 }
.infobulle div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums }
.infobulle i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px }

/* Onglets de liste */
.onglets { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto }
.onglets button { border: 0; background: none; padding: 11px 10px; cursor: pointer; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap }
.onglets button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent) }
.onglets .n { color: var(--text-3); margin-left: 4px; font-variant-numeric: tabular-nums }

/* Tiroir */
.voile { position: fixed; inset: 0; background: var(--overlay); z-index: 20 }
.tiroir { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 21; display: flex; flex-direction: column; box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tiroir header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line) }
.tiroir .corps { padding: 18px 20px; overflow-y: auto; display: grid; gap: 18px; align-content: start; flex: 1 }
.tiroir footer { border-top: 1px solid var(--line); padding: 14px 20px; display: grid; gap: 10px }
.tiroir footer .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.fermer { border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 6px; color: var(--text-2) } .fermer:hover { background: var(--surface-2) }
.gros-montant { font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.encadre { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px }
.encadre.attente { background: var(--warn-soft); border-color: transparent }
.encadre.refus { background: var(--danger-soft); border-color: transparent }
.encadre h3 { margin: 0; font-size: 13px; font-weight: 600 }
.controles { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.controles li { display: flex; align-items: center; gap: 10px }
.controles .etat { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0 }
.controles .etat .ic { width: 12px; height: 12px; stroke-width: 2.4 }
.controles .ok { background: var(--ok-soft); color: var(--ok) } .controles .doute { background: var(--warn-soft); color: var(--warn) } .controles .ko { background: var(--danger-soft); color: var(--danger) }
.controles .v { color: var(--text-3); margin-left: auto; font-size: 12.5px; text-align: right }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 12px; margin: 0 }
.kv dt { color: var(--text-3) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.section-titre { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin: 0 0 8px }
.chrono { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.chrono li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; padding-bottom: 12px; position: relative }
.chrono li::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 0; width: 1px; background: var(--line) }
.chrono li:last-child::before { display: none }
.chrono .pt { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); margin-top: 3px }
.chrono .pt.ok { border-color: var(--ok) } .chrono .pt.refus { border-color: var(--danger) } .chrono .pt.attente { border-color: var(--warn) }
.chrono time { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap }
.echeance { display: flex; align-items: center; gap: 8px; color: var(--warn); font-size: 13px }

/* Incidents : maître-détail */
.md { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start }
.liste-inc { display: grid }
.inc { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 16px; cursor: pointer; display: grid; gap: 4px }
.inc:last-child { border-bottom: 0 }
.inc:hover { background: var(--surface-2) }
.inc[aria-selected="true"] { background: var(--accent-soft) }
.inc .ligne1 { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.inc b { font-weight: 500 }
.inc span { color: var(--text-3); font-size: 12.5px }
.detail { padding: 18px 20px; display: grid; gap: 18px }
.detail h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em }
.chiffres3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.chiffres3 > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px }
.chiffres3 span { color: var(--text-3); font-size: 12.5px }
.chiffres3 b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums }
.extrait { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; line-height: 1.5; overflow-wrap: anywhere }
.extrait mark { background: var(--danger-soft); color: var(--danger); border-radius: 3px; padding: 0 2px }

/* Règles */
.bandeau { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; color: var(--text-2) }
.bandeau b { color: var(--text); font-weight: 500 }
.regle { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.regle:last-child { border-bottom: 0 }
.regle b { font-weight: 500; display: block }
.regle p { margin: 2px 0 0; color: var(--text-3); font-size: 13px }
.regle .valeur { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.regle .portee { display: block; color: var(--text-3); font-size: 12px; font-weight: 400 }
.regle .attente-regle { display: block; margin-top: 4px }
.champ { display: grid; gap: 6px }
.champ label { font-weight: 500 }
.champ input, .champ select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; min-height: 36px }
.champ .aide { color: var(--text-3); font-size: 12.5px }

/* Journal */
.integrite { display: inline-flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 500 }
.empreinte { font-family: var(--mono); font-size: 12px; color: var(--text-2); background: none; border: 0; cursor: pointer; padding: 2px 4px; border-radius: 4px }
.empreinte:hover { background: var(--surface-2) }
tr.nouveau td { animation: flash 1.6s ease-out }
@keyframes flash { from { background: var(--accent-soft) } to { background: transparent } }

/* Modale & toast */
.modale { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px }
.modale h2 { margin: 0; font-size: 16px; font-weight: 600 }
.modale p { margin: 0; color: var(--text-2) }
.modale .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap }
.voile.haut { z-index: 30 }
.toast { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--text); color: var(--bg); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; max-width: min(420px, calc(100vw - 40px)) }
.aide-clavier { color: var(--text-3); font-size: 12.5px }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text-2) }

/* Option A : la console ne signe rien */
.sans-cle { display: flex; gap: 10px; align-items: flex-start; color: var(--text-2); font-size: 13px }
.sans-cle .ic { margin-top: 2px; color: var(--accent) }

/* App mobile d'approbation (aperçu dans un cadre de téléphone) */
.scene-mobile { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; align-items: start }
.explique { display: grid; gap: 14px; max-width: 520px }
.explique ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--text-2) }
.explique b { color: var(--text); font-weight: 500 }
.telephone { width: 360px; max-width: 100%; height: 740px; border-radius: 44px; border: 10px solid #17151e; background: #17151e; box-shadow: var(--shadow); position: relative; overflow: hidden; justify-self: center }
.ecran { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column }
.barre-etat { height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; color: var(--text) }
.encoche { position: absolute; top: 9px; left: 50%; transform: translateX(-50%); width: 96px; height: 26px; border-radius: 20px; background: #17151e; z-index: 2 }
.app-tete { padding: 8px 18px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px }
.app-tete h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em }
.retour { border: 0; background: none; color: var(--accent); font-weight: 500; cursor: pointer; padding: 6px 0; display: inline-flex; align-items: center; gap: 4px }
.retour .ic { transform: rotate(180deg) }
.app-corps { flex: 1; overflow-y: auto; padding: 0 14px 14px; display: grid; gap: 10px; align-content: start }
.carte-m { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; text-align: left; cursor: pointer; width: 100% }
.carte-m .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.carte-m b { font-weight: 600; font-size: 15px }
.carte-m .m { font-weight: 600; font-variant-numeric: tabular-nums }
.carte-m span { color: var(--text-3); font-size: 12.5px }
.app-pied { padding: 12px 14px 22px; border-top: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px }
.app-pied .deux-btn { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px }
.app-pied .btn { justify-content: center; min-height: 46px; border-radius: 12px; font-size: 15px }

        inp.oninput = () => { const s = sens(); aide.textContent = s === "egal" ? `Valeur actuelle : ${eur(r.val)}` : s === "durcit" ? "Plus strict : appliqué immédiatement." : "Plus souple : effectif dans 24 h, approbateurs prévenus."; };
        m.querySelector("#m-ok").onclick = () => {
          const v = +inp.value, s = sens(); if (!v || s === "egal") { fermer(); return; }
          if (s === "durcit") { r.val = v; delete PROG[id]; ajouteJournal(maintenant(), "Claire Martin", "humain", `Règle durcie · ${r.nom} → ${eur(v)} (immédiat)`, id); toast(`${r.nom} : ${eur(v)}, appliqué immédiatement`); }
          else { PROG[id] = v; ajouteJournal(maintenant(), "Claire Martin", "humain", `Assouplissement programmé · ${r.nom} → ${eur(v)} (effectif dans 24 h)`, id); toast(`Assouplissement programmé dans 24 h · approbateurs prévenus`); }
          JOURNAL[0].nouveau = true; nbEntrees++; fermer(); rendre();
        };
      });
  }

  // ---------- Piste d'audit ----------
  let jFiltre = "tous";
  function vueJournal() {
    const liste = JOURNAL.filter((e) => jFiltre === "tous" || e.type === jFiltre);
    const html = `
    <div class="entete"><div><h1>Piste d'audit</h1><p>Chaque décision, de l'agent comme de l'humain, chaînée à la précédente. Une entrée modifiée ou supprimée se voit.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-export="CSV">${ic("telecharger")}CSV</button><button class="btn" data-export="PDF">${ic("telecharger")}PDF signé</button></div></div>
    <section class="carte">
      <header><span class="integrite">${ic("lien")}Chaîne intègre · ${nb(nbEntrees)} entrées · vérifiée à 12:04</span>
        <div class="segment" role="group" aria-label="Filtrer par acteur">${[["tous", "Tout"], ["humain", "Personnes"], ["agent", "Agents"], ["systeme", "Système"]].map(([k, l]) => `<button id="jf-${k}" data-jf="${k}" aria-pressed="${jFiltre === k}">${l}</button>`).join("")}</div></header>
      <div class="defile"><table><thead><tr><th>Date et heure</th><th>Acteur</th><th>Événement</th><th>Référence</th><th>Empreinte</th></tr></thead>
      <tbody>${liste.map((e) => `<tr class="${e.nouveau ? "nouveau" : ""}"><td class="mono" style="white-space:nowrap">${esc(e.quand)}</td>
        <td style="white-space:nowrap">${e.type === "agent" ? `<span class="mono">${esc(e.acteur)}</span>` : esc(e.acteur)}</td><td>${esc(e.evt)}</td><td class="mono">${esc(e.ref)}</td>
        <td><button class="empreinte" data-copier="${e.empreinte}" title="Copier l'empreinte">${e.empreinte.slice(0, 6)}…${e.empreinte.slice(-4)}</button></td></tr>`).join("")}</tbody></table></div>
    </section>`;
    JOURNAL.forEach((e) => (e.nouveau = false));
    return html;
  }

  // ---------- Routage ----------
  const VUES = { apercu: vueApercu, valider: vueValider, incidents: vueIncidents, fournisseurs: vueFournisseurs, agents: vueAgents, regles: vueRegles, journal: vueJournal, acces: vueAcces, mobile: vueMobile };
  const courant = () => { const h = location.hash.slice(1); if (h === "connexion" || /^rapport-INC-\d+$/.test(h)) return h; return VUES[h] ? h : "apercu"; };
  function connexion() {
    let c = $("#connexion");
    if (!c) { c = document.createElement("div"); c.id = "connexion"; c.className = "connexion"; document.body.append(c); }
    c.innerHTML = `<div class="boite">
      <div class="marque" style="padding:0">${$(".marque svg").outerHTML}Veto</div>
      <div><h1>Connexion à la console</h1><p style="margin:4px 0 0;color:var(--text-2)">Aubert Industrie · espace de démonstration</p></div>
      <button class="btn primaire" data-entrer>Continuer avec Microsoft Entra ID</button>
      <button class="btn" data-entrer>Continuer avec Google Workspace</button>
      <p class="note">Connexion par l'identité de votre entreprise. La console est en lecture : un compte Veto ne permet pas de payer. Les décisions se signent dans l'app d'approbation, avec la passkey de l'approbateur.</p>
    </div>`;
    c.querySelectorAll("[data-entrer]").forEach((b) => (b.onclick = () => (location.hash = "apercu")));
  }
  function rendre() {
    const v = courant();
    document.body.classList.toggle("sans-cadre", v === "connexion");
    if (v === "connexion") { connexion(); return; }
    $("#connexion")?.remove();
    const actif = v.startsWith("rapport-") ? "incidents" : v;
    document.querySelectorAll(".nav a").forEach((a) => (a.dataset.vue === actif ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    const main = $("#vue"); main.innerHTML = v.startsWith("rapport-") ? vueRapport(v.slice(8)) : VUES[v]();
    if (v === "apercu") graphique($("#graph"));
    badges();
  }
  window.addEventListener("hashchange", () => { fermerTiroir(); rendre(); $("#vue").focus({ preventScroll: true }); window.scrollTo(0, 0); });

  // Délégation d'événements
  $("#vue").addEventListener("click", (e) => {
    const t = e.target;
    const mb = t.closest("[data-m]"); if (mb) { actionMobile(mb); return; }
    const ag = t.closest("[data-agent]"); if (ag) { tiroirAgent(ag.dataset.agent); return; }
    if (t.closest("#b-export-inc")) { location.hash = "rapport-" + incChoisi; return; }
    const p = t.closest("[data-p]"); if (p) { periode = +p.dataset.p; rendre(); return; }
    const al = t.closest("[data-aller]"); if (al) { location.hash = al.dataset.aller; return; }
    const dm = t.closest("[data-demande]"); if (dm) { if (courant() !== "valider") { const d = DEMANDES.find((x) => x.id === dm.dataset.demande); filtre = d.statut; location.hash = "valider"; setTimeout(() => tiroirDemande(dm.dataset.demande), 30); } else tiroirDemande(dm.dataset.demande); return; }
    const f = t.closest("[data-filtre]"); if (f) { filtre = f.dataset.filtre; choisie = null; rendre(); return; }
    const inA = t.closest("[data-incident]"); if (inA) { incChoisi = inA.dataset.incident; incFiltre = INCIDENTS.find((x) => x.id === incChoisi).statut === "resolu" ? "resolu" : "ouvert"; location.hash = "incidents"; return; }
    const ic2 = t.closest("[data-inc]"); if (ic2) { incChoisi = ic2.dataset.inc; rendre(); return; }
    const icf = t.closest("[data-incf]"); if (icf) { incFiltre = icf.dataset.incf; rendre(); return; }
    if (t.closest("#b-reactiver")) {
      const i = INCIDENTS.find((x) => x.id === incChoisi);
      ouvrirModale(`<h2>Demander la réactivation de ${esc(AGENTS[i.agent].nom)} ?</h2><p>Un agent suspendu ne peut être réactivé qu'avec l'accord de deux administrateurs. Hugo Lemaire recevra la demande.</p>
        <div class="actions"><button class="btn" data-annuler>Annuler</button><button class="btn primaire" id="m-ok">Envoyer la demande</button></div>`,
        (m, fermer) => m.querySelector("#m-ok").onclick = () => { i.statut = "reactivation"; ajouteJournal(maintenant(), "Claire Martin", "humain", `Réactivation demandée · ${AGENTS[i.agent].nom} (1/2)`, i.id); fermer(); toast("Demande envoyée · en attente du second administrateur"); rendre(); });
      return;
    }
    if (t.closest("#b-clore")) {
      const i = INCIDENTS.find((x) => x.id === incChoisi);
      ouvrirModale(`<h2>Clôturer ${esc(i.id)} ?</h2><p>L'incident passe en « Résolu ». Le rapport reste disponible dans la piste d'audit.${AGENTS[i.agent].statut === "suspendu" ? " L'agent reste suspendu tant que deux administrateurs n'ont pas validé sa réactivation." : ""}</p>
        <div class="actions"><button class="btn" data-annuler>Annuler</button><button class="btn primaire" id="m-ok">Clôturer</button></div>`,
        (m, fermer) => m.querySelector("#m-ok").onclick = () => { i.statut = "resolu"; ajouteJournal(maintenant(), "Claire Martin", "humain", `Incident clôturé · ${i.titre}`, i.id); fermer(); toast(`${i.id} clôturé`); rendre(); });
      return;
    }
    if (t.closest("[data-export]")) { toast("Export disponible dans la version produit"); return; }
    const mo = t.closest("[data-modifier]"); if (mo) { modifierRegle(mo.dataset.modifier); return; }
    const jf = t.closest("[data-jf]"); if (jf) { jFiltre = jf.dataset.jf; rendre(); return; }
    const cp = t.closest("[data-copier]"); if (cp) { const v = cp.dataset.copier; (navigator.clipboard?.writeText(v) || Promise.reject()).then(() => toast("Empreinte copiée"), () => toast("Empreinte : " + v)); return; }
  });
  $("#vue").addEventListener("keydown", (e) => {
    const tr = e.target.closest?.("tr[data-demande]"); if (tr && e.key === "Enter") tiroirDemande(tr.dataset.demande);
    const k = e.target.closest?.("[data-aller]"); if (k && e.key === "Enter") location.hash = k.dataset.aller;
  });
  document.addEventListener("keydown", (e) => {
    if (courant() !== "valider" || document.querySelector(".modale") || /input|select|textarea/i.test(e.target.tagName)) return;
    if (e.key !== "j" && e.key !== "k") return;
    const ids = [...document.querySelectorAll("#vue tr[data-demande]")].map((r) => r.dataset.demande); if (!ids.length) return;
    let i = ids.indexOf(choisie); i = e.key === "j" ? Math.min(ids.length - 1, i + 1) : Math.max(0, i - 1);
    tiroirDemande(ids[i]);
  });
  $("#recherche").addEventListener("input", () => { if (courant() !== "valider") { location.hash = "valider"; } else rendre(); });

  rendre();
})();
</script>
