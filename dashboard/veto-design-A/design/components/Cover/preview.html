<!-- @dsCard height=320 -->
<div class="veto" style="background:var(--fond);padding:0"><svg viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Veto">
<!--
Blocs : table (420×44), texte (360×44), accepte-signal (300×44), humain-signal (220×44), refuse-signal (140×44), rayon = pilule (22px), pas de 10px.
Arrangement : cinq bandes pleines d'inégale longueur, empilées, bord gauche à x=480 : les cinq sièges, les cinq couches du flux.
Motif : orbites ovales concentriques derrière les bandes ; ligne de la table ronde, héritage rétro-futuriste du logo (ovale, jamais un cercle).
Pas et rayons : bandes 44 + 10 ; ellipses rx 60, 90, 120, ry 33, 50, 66.
-->
<style>.cv-orb{fill:none;stroke:var(--trait-fort);stroke-width:1.5}.cv-nom{font:600 120px/1 var(--font-sans);fill:var(--texte)}.cv-ligne{font:400 14px/20px var(--font-sans);fill:var(--discret)}
.cv-table{fill:var(--table)}
.cv-texte{fill:var(--texte)}
.cv-accepte-signal{fill:var(--accepte-signal)}
.cv-humain-signal{fill:var(--humain-signal)}
.cv-refuse-signal{fill:var(--refuse-signal)}
</style>
<ellipse class="cv-orb" cx="860" cy="160" rx="120" ry="66"/>
<ellipse class="cv-orb" cx="860" cy="160" rx="180" ry="100"/>
<ellipse class="cv-orb" cx="860" cy="160" rx="240" ry="132"/>
<rect class="cv-table" x="480" y="30" width="420" height="44" rx="22"/>
<rect class="cv-texte" x="480" y="84" width="360" height="44" rx="22"/>
<rect class="cv-accepte-signal" x="480" y="138" width="300" height="44" rx="22"/>
<rect class="cv-humain-signal" x="480" y="192" width="220" height="44" rx="22"/>
<rect class="cv-refuse-signal" x="480" y="246" width="140" height="44" rx="22"/>
<text class="cv-nom" x="40" y="262">Veto</text>
<text class="cv-ligne" x="40" y="296">Plusieurs gardiens. Un seul veto suffit.</text></svg></div>
