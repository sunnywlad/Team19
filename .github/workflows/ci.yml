name: ci

on:
  pull_request:
  push:
    branches: [main]

# Lecture seule par défaut. Aucun job n'a besoin de plus pour l'instant :
# élargir au niveau du job concerné, jamais ici.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Actions épinglées par SHA de commit complet (tag en commentaire).
# Outils épinglés par version exacte ; gitleaks en plus par SHA-256
# (scripts/gitleaks.sh). Chaque job rejoue ce que « make check » lance en
# local : un script de scripts/, ou la cible make du dossier concerné.

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks sur tout l'historique
        run: scripts/gitleaks.sh git --config .gitleaks.toml --log-opts="--full-history HEAD" --redact --no-banner --verbose .
      - name: La détection se déclenche bien sur un secret de test
        run: scripts/test-secret-detection.sh

  contrat:
    name: contrat
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Y a-t-il des contrats ?
        id: detect
        run: |
          if scripts/check-contracts.sh --detect; then
            echo "has_sol=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sol=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.detect.outputs.has_sol == 'true'
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - if: steps.detect.outputs.has_sol == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.has_sol == 'true'
        name: Installer slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.6
      - name: forge test + slither (bloquant sur gravité haute)
        run: scripts/check-contracts.sh

  dependances:
    name: dependances
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Quels manifestes sont présents ?
        id: detect
        run: scripts/check-deps.sh --detect >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      - if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.python == 'true'
        name: Installer pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Lockfiles, versions figées et audit (bloquant sur gravité haute)
        run: scripts/check-deps.sh

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Informatif : un résultat semgrep ne bloque pas la fusion.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.153.1
      - name: semgrep (règles figées, --metrics=off)
        run: scripts/check-semgrep.sh

  specs:
    name: specs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Y a-t-il des specs ?
        id: detect
        run: |
          if [ -f specs/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "specs : dossier absent, rien à valider"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      - if: steps.detect.outputs.present == 'true'
        name: Installer le validateur (lockfile, aucun script tiers)
        working-directory: specs
        run: npm ci --ignore-scripts --no-fund --no-audit
      - if: steps.detect.outputs.present == 'true'
        name: Chaque exemple validé contre son schéma
        run: make specs

  relay:
    name: relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Y a-t-il un relais ?
        id: detect
        run: |
          if [ -f relay/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "relay : dossier absent, rien à tester"
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      # Le test sur chaîne locale a besoin d'anvil et de forge. Si Foundry ne
      # s'installe pas, le job continue : ce test s'ignore de lui-même.
      - if: steps.detect.outputs.present == 'true'
        name: Installer Foundry (facultatif)
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - if: steps.detect.outputs.present == 'true'
        name: Le test sur anvil tournera-t-il ?
        run: |
          if command -v anvil >/dev/null 2>&1 && command -v forge >/dev/null 2>&1; then
            echo "relay : test sur anvil activé"
          else
            echo "::notice title=relay::anvil ou forge indisponible, test sur chaîne locale ignoré"
          fi
      - if: steps.detect.outputs.present == 'true'
        name: Installer les dépendances (lockfile, aucun script tiers)
        working-directory: relay
        run: npm ci --ignore-scripts --no-fund --no-audit
      - if: steps.detect.outputs.present == 'true'
        name: Types
        working-directory: relay
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        name: Tests (scénarios 1, 5 et 8, idempotence, reprise)
        working-directory: relay
        run: npm test

  gateway:
    name: gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      # Le script installe depuis le lockfile, sans script tiers, puis vérifie.
      - name: Types et tests de la porte d'entrée
        run: make gateway

  response:
    name: response
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      # Le script installe depuis le lockfile, sans script tiers, puis vérifie.
      - name: Types et tests du journal et de la réponse
        run: make response

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      # Le script installe depuis le lockfile, sans script tiers, puis vérifie.
      - name: Lint de sécurité, types, tests et contrôle du bundle
        run: make dashboard

  offchain:
    name: offchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # TODO : rendre bloquant quand offchain/cache/server.ts sera versionné. Le
    # fichier était ignoré par une règle « cache/ » du .gitignore : quatre
    # fichiers de test échouent tant qu'il manque.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      # Les tests d'intégration lancent anvil, forge et cast.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5
      - name: Tests du cache, de la passerelle et du vérificateur
        run: make offchain

  demo-smoke:
    name: demo-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Informatif : à rendre bloquant après deux exécutions vertes. Le job
    # échoue aussi quand une scène s'écarte de specs/acceptance/scenarios.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.21.1"
      - name: Installer les dépendances des services (lockfiles, aucun script tiers)
        run: |
          for dir in response gateway relay dashboard; do
            (cd "$dir" && npm ci --ignore-scripts --no-fund --no-audit)
          done
      # Mode fake : faux coffre en mémoire, aucune clé à fournir, aucune chaîne.
      - name: Démo en mode fake, scènes 1, 2, 3, 4 et 8, journal vérifié, arrêt
        run: make demo-smoke
      - name: Logs des services
        if: always()
        run: |
          shopt -s nullglob
          for log in var/demo/*.log; do echo "::group::$log"; cat "$log"; echo "::endgroup::"; done

  detecteur:
    name: detecteur
    # TODO : bloquant une fois le seuil de rappel fixé par Loris.
    # Volontairement non implémenté.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "TODO détecteur"
